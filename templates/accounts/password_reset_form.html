{% extends "base.html" %}

{% block title %}Restablecer contraseña | CargoTrack{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h4">Restablecer contraseña</h1>
      <p class="text-secondary">Ingresa el correo asociado a tu usuario.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Enviar instrucciones</button>
      </form>
    </div></div>
  </div></div>
{% endblock %}
