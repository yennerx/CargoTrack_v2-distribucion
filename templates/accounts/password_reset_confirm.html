{% extends "base.html" %}

{% block title %}Nueva contraseña | CargoTrack{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-4">Define una nueva contraseña</h1>
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary" type="submit">Guardar contraseña</button>
        </form>
      {% else %}
        <p class="text-danger">El enlace ya no es válido.</p>
      {% endif %}
    </div></div>
  </div></div>
{% endblock %}
